<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Networthy HQ — see where you stand{% endblock %}</title>
  {# description / canonical / OG all live in _head_meta.html (per-page overridable). #}
  {% include "_head_meta.html" %}
  <link rel="stylesheet" href="/static/style.css?v={{ version }}" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem('nw-theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body class="mkt">
  <header class="mkt-header">
    <a class="brand" href="/"><span class="mark">₹</span>Networthy HQ</a>
    <nav class="mkt-nav">
      {% block header_cta %}
      <a href="/login" class="mkt-login">Log in</a>
      <a href="/login" class="btn">Get started</a>
      {% endblock %}
    </nav>
  </header>

  {% block content %}{% endblock %}

  {% include "_footer.html" %}
</body>
</html>
