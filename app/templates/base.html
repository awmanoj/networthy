<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Networthy HQ{% endblock %}</title>
  {% include "_head_meta.html" %}
  <link rel="stylesheet" href="/static/style.css?v={{ version }}" />
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    (function () {
      try {
        var t = localStorage.getItem('nw-theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="mark">₹</span>Networthy HQ</a>
    <nav>
      {% if user %}
      <a href="/">Dashboard</a>
      <a href="/networth">Net worth</a>
      <a href="/expenses">Expenses</a>
      <a href="/goals">Goals</a>
      <a href="/nsdl-cas">NSDL CAS</a>
      <span class="user-email">{{ user.email }}</span>
      <form method="post" action="/logout">
        <button class="link-muted" type="submit">Log out</button>
      </form>
      {% endif %}
      <button class="theme-toggle" id="theme-toggle" type="button"
              title="Toggle light / dark" aria-label="Toggle light or dark theme">◑</button>
    </nav>
  </header>
  <main class="{% block main_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  {% include "_footer.html" %}
  <script>
    (function () {
      var root = document.documentElement, btn = document.getElementById('theme-toggle');
      function current() {
        return root.getAttribute('data-theme') ||
          (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      }
      btn.addEventListener('click', function () {
        var next = current() === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('nw-theme', next); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
