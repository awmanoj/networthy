{# Favicons + social share (Open Graph / Twitter) — included in both bases. #}
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v={{ version }}" />
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png?v={{ version }}" />
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v={{ version }}" />
<meta name="theme-color" content="#1f3a5f" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Networthy HQ" />
<meta property="og:title" content="Networthy HQ — see where you stand" />
<meta property="og:description" content="Track your complete net worth — Indian &amp; US stocks, mutual funds, crypto, gold, real estate, bank balances and loans — priced live. Private by design." />
<meta property="og:url" content="{{ site_url }}/" />
<meta property="og:image" content="{{ site_url }}/static/og-image.png?v={{ version }}" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Networthy HQ — see where you stand" />
<meta name="twitter:description" content="Track your complete net worth, priced live. Private by design." />
<meta name="twitter:image" content="{{ site_url }}/static/og-image.png?v={{ version }}" />
