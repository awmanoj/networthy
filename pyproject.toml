[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "networthy"
version = "0.1.6"
description = "Track your complete net worth on your own machine — NSDL/CAMS statement parsing, live prices, retirement projections. India-first, private by design."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Manoj Awasthi" }]
keywords = ["net-worth", "personal-finance", "india", "nsdl", "cas", "mutual-funds", "fire"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]

# Pinned to match requirements.txt — the hosted deployment and a `uvx` install
# should run the same code against the same versions.
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "jinja2==3.1.5",
    "python-multipart==0.0.20",
    "pdfplumber==0.11.5",
    "pikepdf==9.4.2",
    "httpx==0.28.1",
]

[project.urls]
Homepage = "https://networthyhq.com"
Source = "https://github.com/awmanoj/networthy"

[project.scripts]
networthy = "app.launcher:main"

[tool.setuptools.packages.find]
include = ["app*"]

# Templates and static assets are data, not modules — without this the wheel
# ships the Python and none of the pages.
[tool.setuptools.package-data]
app = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
